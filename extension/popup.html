<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spoiler Shield</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <img class="mark" src="icons/icon48.png" width="34" height="34" alt="" />
        <div>
          <h1>Spoiler Shield</h1>
          <p class="tag">NeonGulf · blur spoilers</p>
        </div>
      </header>

      <p id="onboard-tip" class="onboard" hidden>
        Add the spoilers you want blurred, then browse YouTube, Reddit, or X.
        <a href="options.html" id="onboard-link">Open settings</a>
      </p>

      <label class="toggle-row" for="enabled">
        <span>
          <strong id="status-label">Protection on</strong>
          <small>Blur matching titles &amp; thumbnails</small>
        </span>
        <input id="enabled" type="checkbox" role="switch" />
      </label>

      <label class="quick-add" for="quick-keyword">
        <span>Quick add keyword</span>
        <div class="row">
          <input
            id="quick-keyword"
            type="text"
            maxlength="80"
            placeholder="e.g. secret ending"
            autocomplete="off"
          />
          <button id="quick-add-btn" type="button">Add</button>
        </div>
      </label>
      <p id="quick-status" class="quick-status" role="status" hidden></p>

      <div class="stats">
        <span><em id="keyword-count">0</em> keywords</span>
        <a href="options.html" id="open-options">Manage list</a>
      </div>
      <p class="sites">Works on YouTube · Reddit · X</p>
      <p class="privacy-line">Keywords stay in your browser. NeonGulf never sees them.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
