<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spoiler Shield</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header>
          <img class="mark" src="icons/icon48.png" width="34" height="34" alt="" />
        <div>
          <h1>Spoiler Shield</h1>
          <p class="tag">NeonGulf · YouTube · Reddit · X</p>
        </div>
      </header>

      <label class="toggle-row" for="enabled">
        <span>
          <strong id="status-label">Protection on</strong>
          <small>Match keyword list across feed titles</small>
        </span>
        <input id="enabled" type="checkbox" role="switch" />
      </label>

      <div class="stats">
        <span><em id="keyword-count">0</em> keywords</span>
        <a href="options.html" id="open-options">Open settings</a>
      </div>
      <p class="sites">YouTube · Reddit · X</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
